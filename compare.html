<!doctype html>
<html lang="pt-BR" class="compare-html">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comparar Mapas Lado a Lado — Como o Brasil Vota</title>
<meta name="description" content="Compare dois mapas eleitorais lado a lado que se movem juntos: Colunas 3D vs. Densidade de Pontos, ou Eleições 2026 vs. 2022 em qualquer estado brasileiro." />
<link rel="stylesheet" href="style.css" />
<style>
  html.compare-html,
  body.compare-page {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    height: 100vh !important;
    height: 100dvh !important;
    overflow: hidden !important;
    background: var(--bg);
    display: flex !important;
    flex-direction: column !important;
  }
  .compare-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 10px;
    padding: 7px 14px;
    background: rgba(7, 20, 28, 0.96);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    z-index: 20;
  }
  .compare-bar .left,
  .compare-bar .right {
    display: flex;
    align-items: center;
    gap: 6px 10px;
    flex-wrap: wrap;
  }
  .compare-bar a.back-btn {
    color: var(--accent-bright);
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }
  .compare-bar a.back-btn:hover { text-decoration: underline; }
  .compare-bar select,
  .compare-bar button {
    padding: 4px 9px;
    font-size: 11.5px;
  }
  .cmp-sync {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--ink);
    cursor: pointer;
    font-weight: 600;
    user-select: none;
    white-space: nowrap;
  }
  .cmp-sync input {
    accent-color: var(--accent);
    cursor: pointer;
  }
  .cmp-presets {
    display: inline-flex;
    background: #061017;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px;
    gap: 2px;
  }
  .cmp-presets button {
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .cmp-presets button.active {
    background: linear-gradient(135deg, var(--accent-bright), var(--accent));
    color: #04130e;
    font-weight: 700;
  }
  .cmp-keep {
    color: var(--muted);
    white-space: nowrap;
    font-size: 11.5px;
  }
  .cmp-keep a {
    color: var(--accent-bright);
    text-decoration: none;
    font-weight: 600;
    margin-left: 4px;
  }
  .cmp-keep a:hover { text-decoration: underline; }
  main.panes {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 2px;
    background: var(--line);
    position: relative;
  }
  main.panes.swapped #frameA {
    order: 2;
  }
  main.panes iframe {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    border: 0;
    display: block;
    background: var(--bg);
  }
  @media (max-width: 860px) {
    .compare-bar { padding: 5px 8px; gap: 4px 8px; font-size: 11px; }
    .cmp-presets button { padding: 3px 7px; font-size: 10.5px; }
    .cmp-keep { display: none; }
    main.panes {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
  }
</style>
</head>
<body class="compare-page">
  <header class="compare-bar" id="compareBar">
    <div class="left">
      <a class="back-btn" id="backSingle" href="estado.html">← Mapa único</a>
      <span style="color:var(--line)">·</span>
      <label style="display:inline-flex;align-items:center;gap:5px;color:var(--muted)">
        <span>Recorte</span>
        <select id="cmpStateSelect" aria-label="Escolher estado ou Brasil"></select>
      </label>
      <label class="cmp-sync" title="Quando ativado, mover ou aproximar qualquer um dos mapas move o outro junto para o mesmo lugar">
        <input type="checkbox" id="syncCam" checked />
        Mover juntos
      </label>
      <button type="button" id="swapPanes" title="Trocar o mapa da esquerda com o da direita sem recarregar">Trocar ⇄</button>
    </div>
    <div class="right">
      <div class="cmp-presets" id="cmpPresets" role="group" aria-label="Modo de comparação">
        <button type="button" data-preset="cols-dots" class="active">3D × Pontos</button>
        <button type="button" data-preset="2026-2022">2026 × 2022</button>
        <button type="button" data-preset="pres-gov">Pres. × Gov.</button>
      </div>
      <span class="cmp-keep">
        Ficar com:
        <a id="keepA" href="estado.html">Esquerdo</a> ·
        <a id="keepB" href="estado.html">Direito</a>
      </span>
    </div>
  </header>
  <main class="panes" id="panesGrid">
    <iframe id="frameA" name="paneA" title="Mapa esquerdo" allow="clipboard-write"></iframe>
    <iframe id="frameB" name="paneB" title="Mapa direito" allow="clipboard-write"></iframe>
  </main>

<script type="module">
import { STATES, STATE } from './state.js';

const params = new URLSearchParams(location.search);
let currentUf = (params.get('uf') || STATE.slug || 'sp').toLowerCase();
let currentRace = params.get('race') || '2026-pres-2t';
let currentMun = params.get('mun') || '';
let activePreset = params.get('preset') || 'cols-dots';
let swapped = false;

const sorted = [...STATES].sort((a, b) => {
  if (a.slug === 'br') return -1;
  if (b.slug === 'br') return 1;
  return a.name.localeCompare(b.name, 'pt-BR');
});
const sel = document.getElementById('cmpStateSelect');
sel.innerHTML = sorted.map(s => {
  const lbl = s.slug === 'br' ? 'Brasil (Nacional)' : `${s.name} (${s.code})`;
  return `<option value="${s.slug}" ${s.slug === currentUf ? 'selected' : ''}>${lbl}</option>`;
}).join('');

const frameA = document.getElementById('frameA');
const frameB = document.getElementById('frameB');
const panes = [frameA, frameB];
const backBtn = document.getElementById('backSingle');
const keepA = document.getElementById('keepA');
const keepB = document.getElementById('keepB');
const syncCam = document.getElementById('syncCam');
const swapBtn = document.getElementById('swapPanes');
const panesGrid = document.getElementById('panesGrid');
const compareBar = document.getElementById('compareBar');

function layoutPanesHeight() {
  const vh = window.innerHeight || document.documentElement.clientHeight || 700;
  const barH = compareBar ? compareBar.offsetHeight : 44;
  const availH = Math.max(240, vh - barH);
  panesGrid.style.height = `${availH}px`;
}
layoutPanesHeight();

function cleanUnframedUrl(raw) {
  if (!raw) return `estado.html?uf=${currentUf}`;
  try {
    const u = new URL(raw, location.origin);
    u.searchParams.delete('framed');
    return u.pathname.split('/').pop() + (u.searchParams.toString() ? '?' + u.searchParams.toString() : '');
  } catch {
    return raw.replace(/([?&])framed=1(&|$)/, '$1').replace(/[?&]$/, '');
  }
}

function syncKeepLinks() {
  const ordered = swapped ? [frameB, frameA] : [frameA, frameB];
  const getHref = f => {
    try {
      const l = f.contentWindow.location;
      if (l && l.pathname && l.pathname !== 'blank') {
        return cleanUnframedUrl(l.pathname.split('/').pop() + l.search);
      }
    } catch {}
    return cleanUnframedUrl(f.getAttribute('src') || '');
  };
  const urlA = getHref(ordered[0]);
  const urlB = getHref(ordered[1]);
  keepA.href = urlA;
  keepB.href = urlB;
  backBtn.href = urlA;
}

function notifyPaneResize(f) {
  layoutPanesHeight();
  const send = () => {
    try {
      if (f.contentWindow) f.contentWindow.postMessage({ type: 'forceResize' }, '*');
    } catch {}
  };
  send();
  setTimeout(send, 120);
  setTimeout(send, 380);
}

function updateFrames() {
  layoutPanesHeight();
  const munParam = currentMun ? `&mun=${encodeURIComponent(currentMun)}` : '';
  const urlA = params.get('a');
  const urlB = params.get('b');

  if (urlA && urlB && !params.get('preset')) {
    frameA.src = urlA.includes('framed=1') ? urlA : `${urlA}${urlA.includes('?') ? '&' : '?'}framed=1`;
    frameB.src = urlB.includes('framed=1') ? urlB : `${urlB}${urlB.includes('?') ? '&' : '?'}framed=1`;
  } else if (activePreset === '2026-2022') {
    frameA.src = `estado.html?uf=${currentUf}&race=2026-pres-2t&color=margin&framed=1${munParam}`;
    frameB.src = `estado.html?uf=${currentUf}&race=2022-presidente&color=margin&framed=1${munParam}`;
  } else if (activePreset === 'pres-gov') {
    const govRace = currentUf === 'br' ? '2026-pres-1t' : '2026-gov';
    frameA.src = `estado.html?uf=${currentUf}&race=2026-pres-2t&color=margin&framed=1${munParam}`;
    frameB.src = `estado.html?uf=${currentUf}&race=${govRace}&color=margin&framed=1${munParam}`;
  } else {
    frameA.src = `estado.html?uf=${currentUf}&race=${encodeURIComponent(currentRace)}&color=margin&framed=1${munParam}`;
    frameB.src = `estado.html?uf=${currentUf}&race=${encodeURIComponent(currentRace)}&look=dots&framed=1${munParam}`;
  }

  syncKeepLinks();

  const nextParams = new URLSearchParams();
  nextParams.set('uf', currentUf);
  if (currentRace) nextParams.set('race', currentRace);
  if (activePreset !== 'cols-dots') nextParams.set('preset', activePreset);
  if (currentMun) nextParams.set('mun', currentMun);
  history.replaceState(null, '', 'compare.html?' + nextParams.toString());
}

sel.onchange = () => {
  currentUf = sel.value;
  currentMun = '';
  params.delete('a');
  params.delete('b');
  updateFrames();
};

document.querySelectorAll('#cmpPresets button').forEach(btn => {
  btn.classList.toggle('active', btn.dataset.preset === activePreset);
  btn.onclick = () => {
    activePreset = btn.dataset.preset;
    params.delete('a');
    params.delete('b');
    document.querySelectorAll('#cmpPresets button').forEach(b => b.classList.toggle('active', b === btn));
    updateFrames();
  };
});

swapBtn.onclick = () => {
  swapped = !swapped;
  panesGrid.classList.toggle('swapped', swapped);
  syncKeepLinks();
  panes.forEach(notifyPaneResize);
};

const lastCam = new WeakMap();
function forwardCam(from, to) {
  const d = lastCam.get(from.contentWindow);
  if (!d || !to || !to.contentWindow) return;
  try {
    to.contentWindow.postMessage({ ...d, type: 'setCam' }, '*');
  } catch {}
}

panes.forEach((f, i) => f.addEventListener('load', () => {
  syncKeepLinks();
  notifyPaneResize(f);
  if (syncCam.checked) forwardCam(panes[1 - i], f);
}));

window.addEventListener('resize', () => {
  layoutPanesHeight();
  panes.forEach(notifyPaneResize);
});
setInterval(syncKeepLinks, 1200);

syncCam.onchange = () => {
  if (syncCam.checked) forwardCam(frameA, frameB);
};

// Sincronização em tempo real de câmera ("Mover juntos") entre os dois iframes (padrão johnesco/usavote)
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'cam') return;
  const fromIdx = panes.findIndex(f => f.contentWindow === e.source);
  if (fromIdx < 0) return;
  lastCam.set(e.source, e.data);
  if (!syncCam.checked) return;
  const other = panes[1 - fromIdx];
  if (other && other.contentWindow) {
    try {
      other.contentWindow.postMessage({ ...e.data, type: 'setCam' }, '*');
    } catch {}
  }
});

updateFrames();
</script>
</body>
</html>
