<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tour Guiado pelos Municípios — Terra vs. Eleitores</title>
<meta name="description" content="Um sobrevoo guiado pelos municípios brasileiros mostrando como a população e os votos se distribuem no território." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Como o Brasil Vota" />
<meta property="og:title" content="Tour Guiado pelos Municípios — Terra vs. Eleitores" />
<meta property="og:description" content="Um sobrevoo guiado pelos municípios brasileiros mostrando como a população e os votos se distribuem no território." />
<meta name="twitter:card" content="summary" />
<link rel="stylesheet" href="story.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "d3-geo": "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm",
    "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm"
  }
}
</script>
</head>
<body>
<div class="story">
  <header class="topbar">
    <div class="brand" id="brand"><b>Como o Brasil Vota</b> · Um passeio de 60 segundos pelos municípios</div>
    <nav class="links">
      <a href="misread.html" id="linkMisread">Como lemos os mapas errado →</a>
      <a href="estado.html" id="linkExplore">Explorar todos os cargos →</a>
    </nav>
  </header>

  <div class="story-body">
    <div class="card-dock" id="cardDock">
      <div class="card" id="tourCard">
        <div class="card-head">
          <div class="step-tag" id="stepTag">Passo 1 de 6</div>
          <button type="button" id="cardToggleBtn" class="card-min-btn" title="Minimizar ou expandir texto explicativo">Minimizar −</button>
        </div>
        <h1 id="headline"></h1>
        <div class="card-collapsible" id="cardCollapsible">
          <p id="body"></p>
          <div class="stat-row" id="stats"></div>
        </div>
        <div class="timeline-row">
          <div class="track" id="track" role="slider" tabindex="0" aria-label="Cena do tour" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" title="Clique ou arraste para pular para qualquer cena do voo">
            <i id="trackFill"></i>
            <span class="marks" id="trackMarks" aria-hidden="true"></span>
          </div>
          <span class="scene-count" id="sceneCount" aria-hidden="true">1 / 6</span>
        </div>
        <div class="nav">
          <button id="prev" type="button">← Voltar</button>
          <div class="dots" id="dots"></div>
          <button id="play" type="button">▶ Auto</button>
          <button id="next" class="primary" type="button">Próximo →</button>
        </div>
      </div>
    </div>

    <div id="stage">
      <div id="callouts"></div>
    </div>
  </div>
</div>

<script type="module" src="story.js"></script>
</body>
</html>
