<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Como o Brasil Vota — Volume de Votos</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "d3-geo": "https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/+esm"
      }
    }
  </script>
</head>
<body>
  <script type="module" src="sitenav.js"></script>
  <header class="Hud">
    <div class="title-block">
      <h1>Volume Eleitoral 3D</h1>
      <p class="sub">Volume do prisma = total de votos · cada voto ocupa o mesmo espaço 3D</p>
    </div>

    <div class="controls">
      <div class="seg" id="modeToggle" role="tablist" aria-label="Modo de exibição">
        <button data-mode="flat">2D</button>
        <button data-mode="prism" class="active">Volume</button>
        <button data-mode="pour">Despejar</button>
      </div>
      <label class="pick">
        <span>Ano</span>
        <select id="yearSelect"></select>
      </label>
      <label class="pick">
        <span>Disputa</span>
        <select id="raceSelect"></select>
      </label>
    </div>

    <div class="legend">
      <div class="legend-bar">
        <span class="swatch d"></span><span id="legD">PT / Esquerda</span>
        <span class="swatch r"></span><span id="legR">PL / Direita</span>
      </div>
      <div class="totals">
        <span id="totD" class="d">—</span>
        <span class="sep">vs</span>
        <span id="totR" class="r">—</span>
      </div>
    </div>
  </header>

  <main class="map-area">
    <div id="tooltip" hidden></div>

    <div class="cam-Stack">
      <button id="zoomIn" title="Aproximar">+</button>
      <button id="zoomOut" title="Afastar">−</button>
      <button id="camReset" title="Reiniciar visão">⟲</button>
      <button id="camTop" title="Visão de topo 2D">2D</button>
    </div>

    <aside id="detailPanel" hidden>
      <button id="dpClose" aria-label="Fechar">×</button>
      <h2 id="dpName">—</h2>
      <p id="dpSub" class="dp-sub">—</p>
      <div id="dpWinner" class="dp-winner"></div>
      <div id="dpRows" class="dp-rows"></div>
      <div id="dpTotal" class="dp-total"></div>
    </aside>

    <div class="hint">Arraste para girar · Clique direito para mover · Role para zoom · Clique em um município</div>
  </main>

  <script type="module" src="volume.js"></script>
</body>
</html>
